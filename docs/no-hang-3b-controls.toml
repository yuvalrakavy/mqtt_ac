# C-B3: the session waits until the Coolmaster worker has taken what it posted — the shape of the
# bounded queue it used to send on. With the Coolmaster down nothing is taken, so the session never
# reads the CONNACK after a broker blip. (`--bin`: `Mailbox::waiting` exists in test builds only.)
[[control]]
name        = "the_session_waits_for_the_coolmaster"
file        = "src/mqtt_subscriber.rs"
anchor      = '''    if let Posted::Refused(why) = mailbox.post(command.clone()) {'''
replacement = '''    let posted = mailbox.post(command.clone());
    while !mailbox.waiting().is_empty() {
        tokio::time::sleep(std::time::Duration::from_millis(1)).await;
    }
    if let Posted::Refused(why) = posted {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--bin", "mqtt_ac", "--", "a_broker_blip_while_the_coolmaster_is_down"]
expect_text = "did not announce itself and resubscribe"
guard       = "session_never_waits_on_the_device"

# The device-down policy: a state no longer replaces the waiting one for its unit and property, so
# every value set while the Coolmaster was down is replayed on its return.
[[control]]
name        = "every_state_set_while_down_is_replayed"
file        = "src/mailbox.rs"
anchor      = '''        if let Some(i) = self
            .pending
            .iter()
            .position(|e| e.key.as_ref() == Some(&key))
        {
            self.pending.remove(i);
        }'''
replacement = '''        // control: nothing replaced'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "state_set_while_the_coolmaster_is_down"]
expect_text = "only the latest value per unit and property should have waited"
guard       = "state_latest_per_key"

