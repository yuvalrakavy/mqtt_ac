# Negative controls for mqtt_ac's no-hang 3b change (Store no-hang §14). Run from Store with
#     scripts/negative-control.py --root ../Home/mqtt_ac-3b ../Home/mqtt_ac-3b/docs/no-hang-3b-controls.toml
# (The saturation tests' own controls are the failing-first runs: on the session that polled,
# 2 of 300 error publishes and 2 of 300 unit states arrived after the broker recovered, and the
# bridge never reconnected after its connection dropped. The fix round's failing-first runs, on
# a9e654a: the broker blip with the Coolmaster down was never re-announced; every command set
# while the Coolmaster was down was replayed; the ResetFilter got no error; the state a reconnect
# dropped was never sent again; the broker outage was logged per session; the unread commands
# were dropped silently; SIGTERM killed the bridge. Round 2's, on 9810935: a command answered
# with something unusable spun connect-apply-fail; a Coolmaster closing on every command was
# reconnected to at once; an outage's error was published on every retry; a rejection was logged
# as `external_failure`.)
#
# The stand-in Coolmaster serves at most a few connections in the reconnect-loop tests, so a
# mutant that spins is caught after a dozen connections, not thousands: uncapped, one spun 16,282
# in four seconds, and their TIME_WAIT sockets used up this host's ephemeral ports.
#
# A row that drove the Coolmaster path through the pump's forward queue
# (`the_pump_blocks_on_its_forward_queue_coolmaster_path`) is gone: with the mailbox the session
# never waits on the Coolmaster, so that mutation alone can no longer wedge anything — the row came
# back GREEN against `a_burst_of_unit_commands_…`. The guard it stood for is now
# `the_session_waits_for_the_coolmaster`.

# The pump waits while its forward queue holds more than 10 unread commands: a bounded forward
# queue that blocks. The session drives the cycle through the publisher's queue.
[[control]]
name        = "the_pump_blocks_on_its_forward_queue_publisher_path"
file        = "src/mqtt_pump.rs"
anchor      = '''                    backlog.pushed();
                    PumpEvent::Publish(publish)'''
replacement = '''                    backlog.pushed();
                    while backlog.depth.load(Ordering::SeqCst) > 10 {
                        tokio::time::sleep(Duration::from_millis(1)).await;
                    }
                    PumpEvent::Publish(publish)'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_burst_of_bad_commands_against_a_stalled_broker"]
expect_text = "error publishes arrived after the broker recovered"
guard       = "pump_never_waits_on_the_session"

# The announcement made once per session, before the loop (the shape of a bridge that reconnects
# by building a new client), instead of on every CONNACK: rumqttc reconnects inside one event loop
# and the broker keeps no session, so after a drop the bridge is never subscribed again.
[[control]]
name        = "the_announcement_is_made_once_per_session"
file        = "src/mqtt_subscriber.rs"
anchor      = '''    let (_pump, mut incoming) = Pump::start(mqtt_event_loop, outage);

    loop {
        debug!("Waiting for MQTT message");

        // WAIT: mqtt-pump-queue
        let event = incoming.recv().await;
        let publish_packet = match event {
            Some(PumpEvent::Publish(publish_packet)) => publish_packet,
            Some(PumpEvent::Connected) => {
                let topics = [&command_topic, &active_topic, &version_topic];
                announce(&mqtt_client, topics, &version)
                    .await
                    .change_context_lazy(into_context)?;
                // A reconnect without a session dropped whatever rumqttc still held: the
                // publisher sends again the retained state it knows.
                reconnected.notify_one();
                continue;
            }'''
replacement = '''    let (_pump, mut incoming) = Pump::start(mqtt_event_loop, outage);
    let topics = [&command_topic, &active_topic, &version_topic];
    announce(&mqtt_client, topics, &version)
        .await
        .change_context_lazy(into_context)?;
    reconnected.notify_one();

    loop {
        debug!("Waiting for MQTT message");

        // WAIT: mqtt-pump-queue
        let event = incoming.recv().await;
        let publish_packet = match event {
            Some(PumpEvent::Publish(publish_packet)) => publish_packet,
            Some(PumpEvent::Connected) => continue,'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_connection_lost_while_saturated"]
expect_text = "did not announce itself and resubscribe"
guard       = "announce_on_every_connack"

