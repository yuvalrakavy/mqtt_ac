# Negative controls for mqtt_ac's no-hang 3b change (Store no-hang §14). Run from Store with
#     scripts/negative-control.py --root ../Home/mqtt_ac-3b ../Home/mqtt_ac-3b/docs/no-hang-3b-controls.toml
# (The saturation tests' own controls are the failing-first runs: on the session that polled,
# 2 of 300 error publishes and 2 of 300 unit states arrived after the broker recovered, and the
# bridge never reconnected after its connection dropped.)

# The pump waits while its forward queue holds more than 10 unread commands: a bounded forward
# queue that blocks. One mutation, two rows: each test drives a different cycle through it (the
# publisher's queue; the Coolmaster worker's queue, then the publisher's).
[[control]]
name        = "the_pump_blocks_on_its_forward_queue_publisher_path"
file        = "src/mqtt_pump.rs"
anchor      = '''                    backlog.pushed();
                    PumpEvent::Publish(publish)'''
replacement = '''                    backlog.pushed();
                    while backlog.depth.load(Ordering::SeqCst) > 10 {
                        tokio::time::sleep(Duration::from_millis(1)).await;
                    }
                    PumpEvent::Publish(publish)'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_burst_of_bad_commands_against_a_stalled_broker"]
expect_text = "error publishes arrived after the broker recovered"
guard       = "pump_never_waits_on_the_session"

[[control]]
name        = "the_pump_blocks_on_its_forward_queue_coolmaster_path"
file        = "src/mqtt_pump.rs"
anchor      = '''                    backlog.pushed();
                    PumpEvent::Publish(publish)'''
replacement = '''                    backlog.pushed();
                    while backlog.depth.load(Ordering::SeqCst) > 10 {
                        tokio::time::sleep(Duration::from_millis(1)).await;
                    }
                    PumpEvent::Publish(publish)'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_burst_of_unit_commands_against_a_stalled_broker"]
expect_text = "unit states arrived after the broker recovered"
guard       = "pump_never_waits_on_the_session"

# The announcement made once per session, before the loop (the shape of a bridge that reconnects
# by building a new client), instead of on every CONNACK: rumqttc reconnects inside one event loop
# and the broker keeps no session, so after a drop the bridge is never subscribed again.
[[control]]
name        = "the_announcement_is_made_once_per_session"
file        = "src/mqtt_subscriber.rs"
anchor      = '''    let (_pump, mut incoming) = Pump::start(mqtt_event_loop);

    loop {
        debug!("Waiting for MQTT message");

        let publish_packet = match incoming.recv().await { // WAIT: mqtt-pump-queue
            Some(PumpEvent::Publish(publish_packet)) => publish_packet,
            Some(PumpEvent::Connected) => {
                announce(&mqtt_client, &active_topic, &version_topic, &version, &command_topic)
                    .await
                    .change_context_lazy(into_context)?;
                continue;
            }'''
replacement = '''    let (_pump, mut incoming) = Pump::start(mqtt_event_loop);
    announce(&mqtt_client, &active_topic, &version_topic, &version, &command_topic)
        .await
        .change_context_lazy(into_context)?;

    loop {
        debug!("Waiting for MQTT message");

        let publish_packet = match incoming.recv().await { // WAIT: mqtt-pump-queue
            Some(PumpEvent::Publish(publish_packet)) => publish_packet,
            Some(PumpEvent::Connected) => continue,'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_connection_lost_while_saturated"]
expect_text = "did not announce itself and resubscribe"
guard       = "announce_on_every_connack"

# rumqttc's collision left standing across a reconnect: the pump no longer moves it out.
[[control]]
name        = "the_collision_outlives_the_reconnect"
file        = "src/mqtt_pump.rs"
anchor      = '''if let Some(publish) = events.state.collision.take() {'''
replacement = '''if let Some(publish) = None::<rumqttc::v5::mqttbytes::v5::Publish> {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_collision_standing_when_the_connection_drops"]
expect_text = "nothing was sent after the reconnect"
guard       = "collision_cleared_on_error"

[[control]]
name        = "the_backlog_never_raises_its_warn"
file        = "src/mqtt_pump.rs"
anchor      = '''            if high.is_none() {
                *high = Some(Instant::now());'''
replacement = '''            if false {
                *high = Some(Instant::now());'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--", "a_backlog_past_high_water"]
expect_text = "not flagged at the high-water mark"
guard       = "backlog_high_water"

[[control]]
name        = "a_wait_loses_its_tag"
file        = "src/mqtt_pump.rs"
anchor      = '''        let event = self.rx.recv().await; // WAIT: mqtt-pump-queue'''
replacement = '''        let event = self.rx.recv().await;'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "wait_registry"]
expect_text = "is an untagged wait"
guard       = "registry_wired"

[[control]]
name        = "a_collision_is_undeclared"
file        = "docs/wait-registry.md"
anchor      = '''local-methods = connect_to, handle_message, run_session'''
replacement = '''local-methods = handle_message, run_session'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "wait_registry"]
expect_text = "`.connect_to(..).await` on a receiver other than `self`"
guard       = "collision_declared"
