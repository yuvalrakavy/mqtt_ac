# C-7: SIGTERM is not one of the stop signals (a user-defined signal in its place), so it kills the
# bridge: no bounded shutdown, and `main` never returns to drop tracing-init's guard.
[[control]]
name        = "sigterm_is_not_a_stop_signal"
file        = "src/main.rs"
anchor      = '''            terminate: signal(SignalKind::terminate())?,'''
replacement = '''            terminate: signal(SignalKind::user_defined1())?,'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "signals", "--", "sigterm"]
expect_text = "did not stop cleanly on -TERM"
guard       = "sigterm_handled"

# C-9: the shutdown bound removed: a stop that never ends holds `main` for good.
[[control]]
name        = "the_shutdown_is_unbounded"
file        = "src/main.rs"
anchor      = '''    let ended = tokio::time::timeout(grace, stop).await.is_ok();'''
replacement = '''    let ended = {
        let _ = grace;
        stop.await;
