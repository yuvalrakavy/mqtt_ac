# Negative controls for mqtt_ac v2's driver: each row undoes one of the driver's guards and names
# the test that must fail, by its failure text. Run from Store with
#     python3 scripts/negative-control.py --root ../Home/mqtt_ac-v2 ../Home/mqtt_ac-v2/docs/v2-driver-controls.toml
# (`--row NAME` for one). Every row must come back RED.
#
# The runtime's own guards (the pump, the mailbox, outages, the conflict rule, the process) are its
# controls': tracing-init `docs/controls/2026-10-04-bridge-runtime-controls.toml`. v1's no-hang 3b
# controls went with the code they guarded (on branch `v1`).
#
# Run on 2026-10-04, at b2697d6: all 10 RED on the first run (2 min 14 s). Again at 875dc37, with
# `a_failure_code_is_a_number_only` added: all 11 RED (2 min 36 s). Again at eb08298, against the
# gated runtime (tracing-init 67afa2d), with `a_partial_apply_fails_the_whole_write` and
# `a_gone_unit_keeps_its_state` added and `a_refusal_ends_the_apply` re-anchored: all 13 RED
# (3 min 1 s). Again on 2026-10-08 at 98b6244, against tracing-init 0617008 (round 2): all 13 RED
# (3 min 3 s), nothing to adapt.
#
# Failing first, beyond these rows: `one_bad_ls2_line_does_not_fail_the_listing` against 7c03022,
# where the listing still parsed as v1's did — "L1.001's State was never published beside a bad
# line for L1.002: None", about 100 polls in 20 s; the row `one_bad_line_fails_the_listing` undoes
# that fix. And `a_unit_in_failure_keeps_its_state_current` with
# `protocol::tests::a_failure_code_is_the_controllers_text` against b8b2402, where a failure code
# was a number only — "a unit in failure with an alphanumeric code was not published: … \"failure_code\":
# Null …" and "a unit in failure with code `A3` was not read as that code: Err(\"failure code `A3`\")";
# the row `a_failure_code_is_a_number_only` undoes that fix.

# --- The classification (Bridge Runtime spec §4.3) ---

# An error status taken for success: the CoolMaster's refusal never reaches the Store.
[[control]]
name        = "an_error_status_is_success"
file        = "src/protocol.rs"
anchor      = '''        status => Err(OpError::Rejected(format!("the CoolMaster answered `{status}`"))),'''
replacement = '''        _status => Ok(body.to_owned()),'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_rejected_value_is_an_error_and_the_rest_still_applies", "--exact"]
expect_text = '''the refused setpoint got no Error'''
guard       = "error_status_is_rejected"

# A reply that is not text taken for a lost link: the request is held and applied again on the
# next connection instead of reported — the no-hang 3b hot loop, now paced, but still a reconnect
# per unusable reply.
[[control]]
name        = "an_unreadable_reply_is_a_lost_link"
file        = "src/protocol.rs"
anchor      = '''        return Err(OpError::Unusable("the CoolMaster's reply is not text".into()));'''
replacement = '''        return Err(OpError::Link(mqtt_bridge_kit::LinkError::new("the CoolMaster's reply is not text")));'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "an_unusable_reply_is_passed_over_on_the_same_connection", "--exact"]
expect_text = '''the unusable reply got no Error'''
guard       = "unreadable_reply_is_unusable"

# A connection that closed instead of answering taken for an unusable answer: the request is
# reported and dropped, and the dead link is never reconnected.
[[control]]
name        = "a_closed_connection_is_an_unusable_reply"
file        = "src/driver.rs"
anchor      = '''            return Err(OpError::Link(LinkError::new("the CoolMaster closed the connection")));'''
replacement = '''            return Err(OpError::Unusable("the CoolMaster closed the connection".into()));'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_connection_closed_mid_command_is_a_lost_link_and_the_request_is_applied_on_reconnect", "--exact"]
expect_text = '''the request was not applied after the reconnect'''
guard       = "closed_connection_is_the_link"

# --- The ls2 listing, a line at a time ---

# One bad line fails the whole listing, as v1's did.
[[control]]
name        = "one_bad_line_fails_the_listing"
file        = "src/protocol.rs"
anchor      = '''                listing.bad.push(BadLine { unit, line: line.to_owned(), why });'''
replacement = '''                listing.bad.push(BadLine { unit, line: line.to_owned(), why });
                listing.states.clear();
                return listing;'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "one_bad_ls2_line_does_not_fail_the_listing", "--exact"]
expect_text = '''was never published beside a bad line'''
guard       = "ls2_per_line_tolerance"

# A failure code read as a number only, as v1's was: an alphanumeric code (`U4`) makes the line
# unusable, and the unit's State freezes while it is in failure.
[[control]]
name        = "a_failure_code_is_a_number_only"
file        = "src/protocol.rs"
anchor      = '''        code => Value::from(code),'''
replacement = '''        code => Value::from(code.parse::<u16>().map_err(|_| format!("failure code `{code}`"))?),'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_unit_in_failure_keeps_its_state_current", "--exact"]
expect_text = '''a unit in failure with an alphanumeric code was not published'''
guard       = "failure_code_as_printed"

# --- The apply order ---

# Power on sent last, after the settings a unit that is off may not take.
[[control]]
name        = "power_on_goes_last"
file        = "src/protocol.rs"
anchor      = '''        POWER => 0,'''
replacement = '''        POWER => 6,'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_target_level_desired_becomes_coolmaster_commands_in_order_and_state_follows", "--exact"]
expect_text = '''the request did not reach the CoolMaster once, in its order'''
guard       = "apply_order_power_on_first"

# Power off sent first, before the settings.
[[control]]
name        = "power_off_goes_first"
file        = "src/protocol.rs"
anchor      = '''        POWER if values.get(POWER) == Some(&Value::Bool(false)) => 5,'''
replacement = '''        POWER if values.get(POWER) == Some(&Value::Bool(false)) => 0,'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--lib", "--", "protocol::tests::an_apply_goes_power_on_first_then_mode_setpoint_fan_and_power_off_last", "--exact"]
expect_text = '''turning a unit off does not go mode, setpoint, fan, then power last'''
guard       = "apply_order_power_off_last"

# --- The setpoint ---

# The raw float sent, as before the review: float noise and absurd numbers go to the CoolMaster.
[[control]]
name        = "a_setpoint_is_sent_raw"
file        = "src/protocol.rs"
anchor      = '''    format!("{:.1}", (t * 10.0).round() / 10.0)'''
replacement = '''    format!("{t}")'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--lib", "--", "protocol::tests::a_setpoint_is_rounded_to_the_coolmasters_step_and_kept_in_range", "--exact"]
expect_text = '''was not sent as'''
guard       = "setpoint_step"

# Any finite setpoint taken: 1e300 °C goes to the CoolMaster.
[[control]]
name        = "any_setpoint_is_in_range"
file        = "src/protocol.rs"
anchor      = '''            Some(t) if SETPOINT_RANGE.contains(&t) =>'''
replacement = '''            Some(t) if t.is_finite() =>'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--lib", "--", "protocol::tests::a_setpoint_is_rounded_to_the_coolmasters_step_and_kept_in_range", "--exact"]
expect_text = '''was not refused'''
guard       = "setpoint_range"

# A °C setpoint sent to a °F unit as is, as v1 sent it: 23 °C read as 23 °F.
[[control]]
name        = "a_fahrenheit_unit_gets_celsius"
file        = "src/protocol.rs"
anchor      = '''        Scale::Fahrenheit => celsius * 9.0 / 5.0 + 32.0,'''
replacement = '''        Scale::Fahrenheit => celsius,'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_unit_in_fahrenheit_gets_its_setpoint_in_fahrenheit", "--exact"]
expect_text = '''a °C setpoint was not sent to a °F unit in °F'''
guard       = "fahrenheit_setpoint"

# A property that fails on its own ends the apply: a refused setpoint costs the power-off sent
# after it.
[[control]]
name        = "a_refusal_ends_the_apply"
file        = "src/driver.rs"
anchor      = '''                Err(e) => failed.push(failure(step.property, e)),'''
replacement = '''                Err(e) => {
                    failed.push(failure(step.property, e));
                    break;
                }'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_rejected_value_is_an_error_and_the_rest_still_applies", "--exact"]
expect_text = '''turning the unit off was lost to the refused setpoint'''
guard       = "apply_passes_over_a_failed_property"

# A write with one refused property reported as failed whole (a plain `Rejected`, as before
# `OpError::Partial`): the power-off the CoolMaster took is reported failed too, and the Store
# abandons it.
[[control]]
name        = "a_partial_apply_fails_the_whole_write"
file        = "src/driver.rs"
anchor      = '''        Err(OpError::Partial(failed))'''
replacement = '''        Err(OpError::Rejected(failed[0].error.clone()))'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_rejected_value_is_an_error_and_the_rest_still_applies", "--exact"]
expect_text = '''the power-off, which the CoolMaster took, was reported failed'''
guard       = "apply_outcome_per_property"

# --- The unit address, the read-back, the registry ---

# Any target taken for a unit address: a space or a `\r` starts a second command on the
# CoolMaster, and an empty one makes `filt` reset every unit.
[[control]]
name        = "any_target_is_a_unit_address"
file        = "src/protocol.rs"
anchor      = '''    !unit.is_empty() && unit.len() <= 32 && unit.bytes().all(|b| b.is_ascii_alphanumeric() || matches!(b, b'.' | b'_' | b'-'))'''
replacement = '''    let _ = unit;
    true'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--lib", "--", "protocol::tests::a_target_that_is_not_a_unit_address_is_rejected", "--exact"]
expect_text = '''was planned'''
guard       = "unit_address_guard"

# No read-back after a write: with polling off, the unit's State never follows.
[[control]]
name        = "no_read_back_after_a_command"
file        = "src/driver.rs"
anchor      = '''            self.read_back(target, started).await;'''
replacement = '''            let _ = (target, started);'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_property_write_becomes_its_command", "--exact"]
expect_text = '''the unit's State did not follow'''
guard       = "read_back_after_a_command"

# No read-back after ResetFilter: with polling off, `filter_change` never follows.
[[control]]
name        = "no_read_back_after_reset_filter"
file        = "src/driver.rs"
anchor      = '''        self.read_back(unit, started).await;'''
replacement = '''        let _ = (unit, started);'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "reset_filter_resets_the_units_filter", "--exact"]
expect_text = '''the filter flag was not reset'''
guard       = "read_back_after_reset_filter"

# The read-back inside the operation's deadline, as before the review: a stall in it turns the
# confirmed command into `link_lost`.
[[control]]
name        = "the_read_back_has_no_bound_of_its_own"
file        = "src/driver.rs"
anchor      = '''        let read = tokio::time::timeout(budget, self.read_state(Scope::Target(unit.to_owned()))).await;'''
replacement = '''        let read: Result<_, tokio::time::error::Elapsed> = Ok(self.read_state(Scope::Target(unit.to_owned())).await);'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_stalled_read_back_leaves_a_confirmed_command_confirmed", "--exact"]
expect_text = '''a confirmed command was reported failed'''
guard       = "read_back_bound"

# A read-back that finds the link dead keeps it to itself: with polling off, the bridge stays
# "connected" on a dead socket.
[[control]]
name        = "a_dead_read_back_is_not_reported"
file        = "src/driver.rs"
anchor      = '''            handle.link_lost(lost);'''
replacement = '''            let _ = (handle, lost);'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_read_back_that_finds_the_link_dead_reports_it_lost", "--exact"]
expect_text = '''the bridge still says connected on a dead link'''
guard       = "read_back_link_lost"

# A unit gone from the listing left as last read: its retained State stays at the broker, a ghost.
[[control]]
name        = "a_gone_unit_keeps_its_state"
file        = "src/driver.rs"
anchor      = '''                    report.remove(&unit);'''
replacement = '''                    let _ = (report, &unit);'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_unit_gone_from_the_listing_has_its_state_retracted", "--exact"]
expect_text = '''the State of a unit gone from the listing was not retracted'''
guard       = "gone_unit_retracted"

# A line whose address is garbled counted as a listing that can say who is there: the real unit
# looks gone and is retracted, and later the garbage itself is.
[[control]]
name        = "a_garbled_address_says_who_is_there"
file        = "src/driver.rs"
anchor      = '''        if !certain || listing.states.is_empty() {'''
replacement = '''        if listing.states.is_empty() {
            let _ = certain;'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "a_garbled_unit_address_retracts_nothing", "--exact"]
expect_text = '''a unit was retracted because its address was listed garbled'''
guard       = "garbled_address_no_inference"

# An empty listing taken for "no units": every unit is retracted at once.
[[control]]
name        = "an_empty_listing_says_no_units"
file        = "src/driver.rs"
anchor      = '''        if !certain || listing.states.is_empty() {'''
replacement = '''        if !certain || (listing.states.is_empty() && !listing.bad.is_empty()) {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "driver", "--", "an_empty_or_unusable_listing_retracts_nothing", "--exact"]
expect_text = '''an empty listing retracted units'''
guard       = "empty_listing_no_inference"

# An unusable listing (no line can be read) taken as saying who is there.
[[control]]
name        = "an_unusable_listing_says_who_is_there"
file        = "src/driver.rs"
anchor      = '''        if !certain || listing.states.is_empty() {'''
replacement = '''        if !certain || (listing.states.is_empty() && listing.bad.is_empty()) {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--lib", "--", "driver::tests::a_unit_is_gone_only_after_two_usable_listings_omit_it", "--exact"]
expect_text = '''an unusable listing retracted a unit'''
guard       = "unusable_listing_no_inference"

# One omission enough: a listing cut short or mid-scan retracts a unit.
[[control]]
name        = "one_omission_is_gone"
file        = "src/driver.rs"
anchor      = '''pub const GONE_AFTER: u32 = 2;'''
replacement = '''pub const GONE_AFTER: u32 = 1;'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--lib", "--", "driver::tests::a_unit_is_gone_only_after_two_usable_listings_omit_it", "--exact"]
expect_text = '''one omission retracted a unit'''
guard       = "gone_after_two_listings"

# A unit never reported (known only from a garbled line) retracted anyway.
[[control]]
name        = "an_unreported_unit_is_retracted"
file        = "src/driver.rs"
anchor      = '''            if known.reported {'''
replacement = '''            if known.reported || known.missed > 0 {'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--lib", "--", "driver::tests::a_unit_is_gone_only_after_two_usable_listings_omit_it", "--exact"]
expect_text = '''a unit never reported was retracted'''
guard       = "retract_only_reported"

# A wait with no tag: the registry test is wired to the driver's source.
[[control]]
name        = "a_wait_loses_its_tag"
file        = "src/driver.rs"
anchor      = '''        // WAIT: coolmaster-io
        link.read_until(b'>', &mut reply).await.map_err(lost)?;'''
replacement = '''        link.read_until(b'>', &mut reply).await.map_err(lost)?;'''
target      = "command"
argv        = ["cargo", "test", "-q", "--target", "aarch64-apple-darwin", "--test", "wait_registry"]
expect_text = '''is an untagged wait'''
guard       = "registry_wired"
