[package]
name = "mqtt_ac"
version = "0.2.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2.0.12"
error-stack = "0.6.0" 
tokio = { version="1.47.1", features = ["full", "tracing"]}
tokio-util = "0.7.16"
tokio-stream = "0.1.17"
async-channel = "2.5.0"
serde_json = "1.0.142"
serde = { version = "1.0.219", features = ["derive"] }
rumqttc = { version = "0.25.1", default-features = false }
rustop = "1.1.4"
tracing = { version = "0.1.41"  }
log = "0.4.27"
tracing-init = { git="http://github.com/yuvalrakavy/tracing-init.git", features = ["otel"] }
built = "0.8.0"

[build-dependencies]
built = { version= "0.8.0", features = ["chrono"] }

# The otel feature was added at git rev 69ff434 (version 0.2.0).
# Run `cargo update -p tracing-init` after first clone to refresh the lock file.

# to run with logging use
#  RUST_LOG=trace,rumqttc=off mqtt_ac ...
