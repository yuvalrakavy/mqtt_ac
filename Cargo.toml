[package]
name = "mqtt_ac"
version = "2.0.0"
edition = "2021"
description = "The CoolMaster bridge: the Bridge Kit grammar, on the Bridge Runtime (mqtt-bridge-kit)"
license = "MIT"

# v2 serves the new Store only. The old home system keeps v1: branch `v1`, tag `v0.2.1`.

[lib]
path = "src/lib.rs"

[[bin]]
name = "mqtt_ac"
path = "src/main.rs"

[dependencies]
mqtt-bridge-kit = { git = "https://github.com/yuvalrakavy/tracing-init.git", rev = "69a42b9" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time"] }
tracing = "0.1"

[dev-dependencies]
# The fleet's test tools, from the same repository as the runtime (one revision for all).
mqtt-test-broker = { git = "https://github.com/yuvalrakavy/tracing-init.git", rev = "69a42b9" }
wait-lint = { git = "https://github.com/yuvalrakavy/tracing-init.git", rev = "69a42b9" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
# The driver tests' log capture (tests/support/log.rs).
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

# to run with logging use
#  RUST_LOG=trace,rumqttc=off mqtt_ac ...
