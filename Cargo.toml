[package]
name = "mqtt_ac"
version = "2.0.0"
edition = "2021"
description = "The CoolMaster bridge: the Bridge Kit grammar, on the Bridge Runtime (mqtt-bridge-kit)"
license = "MIT"

# v2 serves the new Store only. The old home system keeps v1: branch `v1`, tag `v0.2.1`.

[lib]
path = "src/lib.rs"

[[bin]]
name = "mqtt_ac"
path = "src/main.rs"

[dependencies]
# TODO: pin to the tracing-init git rev once R1 merges
mqtt-bridge-kit = { path = "/Users/yuval/Documents/Projects/tracing-init-br/mqtt-bridge-kit" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time"] }
tracing = "0.1"

[dev-dependencies]
# The fleet's test tools, from the same repository as the runtime (one revision for all).
# TODO: pin to the tracing-init git rev once R1 merges
mqtt-test-broker = { path = "/Users/yuval/Documents/Projects/tracing-init-br/mqtt-test-broker" }
# TODO: pin to the tracing-init git rev once R1 merges
wait-lint = { path = "/Users/yuval/Documents/Projects/tracing-init-br/wait-lint" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

# to run with logging use
#  RUST_LOG=trace,rumqttc=off mqtt_ac ...
